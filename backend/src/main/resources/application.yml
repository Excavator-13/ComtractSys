server:
  port: 8080

spring:
  application:
    name: contract-sys-backend
  mvc:
    format:
      date: iso
  datasource:
    url: jdbc:h2:mem:contractsys;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB

app:
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:123456}
  upload-dir: uploads
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-256-bits-long-enough-for-hs256}
    expiration: 86400
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/contractsys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:contractsys}
    password: ${MYSQL_PASSWORD:contractsys}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/mysql

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/contractsys}
    username: ${POSTGRES_USERNAME:contractsys}
    password: ${POSTGRES_PASSWORD:contractsys}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/postgres

---
spring:
  config:
    activate:
      on-profile: redis
  cache:
    type: redis
    redis:
      time-to-live: 10m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: functional-test
  datasource:
    url: jdbc:h2:mem:contractsys_func;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cache:
    type: simple
  flyway:
    locations: classpath:db/migration/h2
app:
  demo-data:
    enabled: true
