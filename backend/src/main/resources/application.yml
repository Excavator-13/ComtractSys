server:
  port: 8080

spring:
  application:
    name: contract-sys-backend
  datasource:
    url: jdbc:h2:mem:contractsys;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

app:
  upload-dir: uploads
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-256-bits-long-enough-for-hs256}
    expiration: 86400

